spring.application.name=jobconnect-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobconnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
